name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows Platform Files
        working-directory: memontra_booth
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        working-directory: memontra_booth
        run: flutter pub get

      - name: Build Windows App (Release)
        working-directory: memontra_booth
        run: flutter build windows --release

      - name: Bundle Visual C++ Runtime & Dependencies
        shell: pwsh
        run: |
          $releaseDir = "memontra_booth/build/windows/x64/runner/Release"
          Write-Host "Target Release Directory: $releaseDir"

          # 1. Copy essential 64-bit C++ runtime DLLs from System32
          $runtimeFiles = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll")
          foreach ($file in $runtimeFiles) {
            $src = "C:\Windows\System32\$file"
            if (Test-Path $src) {
              Copy-Item $src -Destination $releaseDir -Force
              Write-Host "Copied $file from System32"
            } else {
              Write-Warning "Could not find $src"
            }
          }

          # 2. Download official vc_redist.x64.exe installer into the folder as an offline backup
          try {
            Write-Host "Downloading official vc_redist.x64.exe..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$releaseDir\vc_redist.x64.exe"
            Write-Host "Downloaded vc_redist.x64.exe successfully."
          } catch {
            Write-Warning "Failed to download vc_redist.x64.exe: $_"
          }

          Write-Host "Final Contents of Release directory:"
          Get-ChildItem $releaseDir | Select-Object Name, Length

      - name: Create Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "memontra_booth/build/windows/x64/runner/Release/*" -DestinationPath "memontra-booth-windows-v2.0.0.zip" -Force
          Write-Host "Zip created successfully:"
          Get-Item memontra-booth-windows-v2.0.0.zip | Select-Object Name, Length

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memontra-booth-windows
          path: memontra_booth/build/windows/x64/runner/Release/
          retention-days: 14

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Publishing to GitHub Releases v2.0.0..."
          $tag = "v2.0.0"
          $zip = "memontra-booth-windows-v2.0.0.zip"
          $title = "Memontra Booth Windows v2.0.0 (Standalone)"
          $notes = "Official standalone Windows release v2.0.0. Features: DOKU payment gateway integration, custom frame templates management, custom background styling, external camera device selector, and softfile framed photo download."

          # Periksa apakah release sudah ada
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Uploading zip asset with --clobber..."
            gh release upload $tag $zip --clobber
          } else {
            Write-Host "Creating new GitHub Release $tag..."
            gh release create $tag $zip --title $title --notes $notes
          }
