name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean Stale Ephemeral Files
        shell: pwsh
        run: |
          if (Test-Path memontra_booth/windows/flutter/ephemeral) {
            Remove-Item -Recurse -Force memontra_booth/windows/flutter/ephemeral
          }
          if (Test-Path memontra_booth/windows/flutter/generated_plugins.cmake) {
            Remove-Item -Force memontra_booth/windows/flutter/generated_plugins.cmake
          }

      - name: Install Flutter Dependencies
        working-directory: memontra_booth
        run: flutter pub get

      - name: Build Windows Executable
        working-directory: memontra_booth
        run: flutter build windows --release --verbose

      - name: Archive Windows Release
        shell: pwsh
        working-directory: memontra_booth/build/windows/x64/runner/Release
        run: |
          Compress-Archive -Path * -DestinationPath ../../../../../memontra-booth-windows.zip -Force

      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: memontra-booth-windows
          path: memontra-booth-windows.zip
          retention-days: 14
