name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows Platform Files
        working-directory: memontra_booth
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        working-directory: memontra_booth
        run: flutter pub get

      - name: Build Windows App (Release)
        working-directory: memontra_booth
        run: flutter build windows --release

      - name: Bundle Visual C++ Runtime & Dependencies
        shell: pwsh
        run: |
          $releaseDir = "memontra_booth/build/windows/x64/runner/Release"
          Write-Host "Target Release Directory: $releaseDir"

          # 1. Copy essential 64-bit C++ runtime DLLs from System32
          $runtimeFiles = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll")
          foreach ($file in $runtimeFiles) {
            $src = "C:\Windows\System32\$file"
            if (Test-Path $src) {
              Copy-Item $src -Destination $releaseDir -Force
              Write-Host "Copied $file from System32"
            } else {
              Write-Warning "Could not find $src"
            }
          }

          # 2. Download official vc_redist.x64.exe installer into the folder as an offline backup
          try {
            Write-Host "Downloading official vc_redist.x64.exe..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$releaseDir\vc_redist.x64.exe"
            Write-Host "Downloaded vc_redist.x64.exe successfully."
          } catch {
            Write-Warning "Failed to download vc_redist.x64.exe: $_"
          }

          Write-Host "Final Contents of Release directory:"
          Get-ChildItem $releaseDir | Select-Object Name, Length

      - name: Create Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "memontra_booth/build/windows/x64/runner/Release/*" -DestinationPath "memontra-booth-windows-v2.0.1.zip" -Force
          Write-Host "Zip created successfully:"
          Get-Item memontra-booth-windows-v2.0.1.zip | Select-Object Name, Length

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memontra-booth-windows
          path: memontra_booth/build/windows/x64/runner/Release/
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "Memontra Booth Windows v2.0.1 (Update QRIS & Display)"
          body: "Official standalone Windows release v2.0.1. Updates: Official Bank Indonesia EMVCo QRIS string for all m-banking/e-wallets, anti-gepeng responsive camera & strip preview for all Windows monitor resolutions, and lightweight compressed softfile upload."
          files: memontra-booth-windows-v2.0.1.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
