name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows Platform Files
        working-directory: memontra_booth
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        working-directory: memontra_booth
        run: flutter pub get

      - name: Build Windows App (Release)
        working-directory: memontra_booth
        run: flutter build windows --release

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memontra-booth-windows
          path: memontra_booth/build/windows/x64/runner/Release/
          retention-days: 14
